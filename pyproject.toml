[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clocktower-lab"
version = "0.1.0"
description = "Local autonomous Blood on the Clocktower simulation laboratory"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "mypy>=1.15,<2", "ruff>=0.11,<1", "playwright>=1.50,<2", "build>=1,<2"]

[project.scripts]
clocktower = "clocktower.cli:main"

[tool.setuptools.packages.find]
include = ["clocktower*"]

[tool.setuptools.package-data]
clocktower = ["personas/*.md", "web/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["browser: real Chromium frontend smoke test"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true

[tool.ruff]
line-length = 110
